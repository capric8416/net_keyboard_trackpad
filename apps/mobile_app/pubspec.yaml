name: net_keyboard_mobile
description: Android remote keyboard client.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  crypto: ^3.0.7
  ffi: ^2.1.4
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  grpc: ^5.2.0
  path_provider: ^2.1.5
  record: ^7.1.1
  remote_input_core:
    path: ../../packages/remote_input_core
  remote_input_protocol:
    path: ../../packages/remote_input_protocol
  shared_preferences: ^2.5.4
  uuid: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/speech/
    - assets/speech/funasr-paraformer-zh/
    - assets/speech/funasr-fsmn-vad/

