name: net_keyboard_desktop
description: Windows remote input receiver.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  basic_utils: ^5.8.2
  crypto: ^3.0.7
  fixnum: ^1.1.1
  desktop_input_windows:
    path: ../../packages/desktop_input_windows
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  grpc: ^5.2.0
  path_provider: ^2.1.5
  pointycastle: ^4.0.0
  remote_input_core:
    path: ../../packages/remote_input_core
  remote_input_protocol:
    path: ../../packages/remote_input_protocol
  shared_preferences: ^2.5.4
  system_tray: ^2.0.3
  uuid: ^3.0.7
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - windows/runner/resources/app_icon.ico

