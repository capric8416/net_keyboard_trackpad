syntax = "proto3";

package netkeyboard.v1;

service RemoteInputService {
  rpc GetServerInfo(ServerInfoRequest) returns (ServerInfoResponse);
  rpc CreatePairingChallenge(PairingChallengeRequest)
      returns (PairingChallengeResponse);
  rpc Pair(PairRequest) returns (PairResponse);
  rpc Control(stream ClientEnvelope) returns (stream ServerEnvelope);
}

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message ServerInfoRequest {}

message ServerInfoResponse {
  string server_id = 1;
  string display_name = 2;
  ProtocolVersion protocol_version = 3;
  string certificate_sha256 = 4;
  repeated Capability capabilities = 5;
  bool pairing_enabled = 6;
}

message PairingChallengeRequest {
  string client_instance_id = 1;
}

message PairingChallengeResponse {
  string challenge_id = 1;
  bytes server_nonce = 2;
  int64 expires_at_unix_ms = 3;
}

message PairRequest {
  string challenge_id = 1;
  string client_instance_id = 2;
  string client_name = 3;
  string totp_code = 4;
  bytes client_nonce = 5;
  ProtocolVersion protocol_version = 6;
}

message PairResponse {
  string paired_device_id = 1;
  bytes bearer_token = 2;
  string server_id = 3;
  ProtocolVersion protocol_version = 4;
  repeated Capability capabilities = 5;
  int64 token_created_at_unix_ms = 6;
}

message ClientEnvelope {
  uint64 sequence = 1;
  string event_id = 2;

  oneof payload {
    ClientHello hello = 10;
    KeyStroke key_stroke = 11;
    TextInput text_input = 12;
    Ping ping = 13;
    PointerInput pointer_input = 14;
  }
}

message ServerEnvelope {
  uint64 acknowledged_sequence = 1;

  oneof payload {
    ServerHello hello = 10;
    CommandResult result = 11;
    Pong pong = 12;
    SessionClosing closing = 13;
  }
}

message ClientHello {
  string client_instance_id = 1;
  string client_name = 2;
  ProtocolVersion protocol_version = 3;
  repeated Capability capabilities = 4;
}

message ServerHello {
  string server_id = 1;
  string display_name = 2;
  ProtocolVersion protocol_version = 3;
  repeated Capability capabilities = 4;
  uint32 heartbeat_interval_seconds = 5;
}

message KeyStroke {
  SemanticKey key = 1;
  uint32 modifier_bits = 2;
  bool repeated = 3;
}

message TextInput {
  string text = 1;
}

message PointerInput {
  sint32 delta_x = 1;
  sint32 delta_y = 2;
  sint32 wheel_delta = 3;
  PointerButton button = 4;
  bool button_down = 5;
  sint32 horizontal_wheel_delta = 7;
}

enum PointerButton {
  POINTER_BUTTON_NONE = 0;
  POINTER_BUTTON_LEFT = 1;
  POINTER_BUTTON_RIGHT = 2;
  POINTER_BUTTON_MIDDLE = 3;
}

message Ping {
  int64 sent_at_unix_ms = 1;
}

message Pong {
  int64 client_sent_at_unix_ms = 1;
  int64 server_sent_at_unix_ms = 2;
}

message SessionClosing {
  ErrorCode reason = 1;
  string message = 2;
}

message CommandResult {
  string event_id = 1;
  bool success = 2;
  ErrorCode error_code = 3;
  string message = 4;
  uint32 injected_event_count = 5;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_KEY_STROKE = 1;
  CAPABILITY_UNICODE_TEXT = 2;
  CAPABILITY_POINTER = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_OK = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_PAIRING_DISABLED = 3;
  ERROR_CODE_PAIRING_EXPIRED = 4;
  ERROR_CODE_INVALID_TOTP = 5;
  ERROR_CODE_RATE_LIMITED = 6;
  ERROR_CODE_CERTIFICATE_CHANGED = 7;
  ERROR_CODE_INCOMPATIBLE_PROTOCOL = 8;
  ERROR_CODE_CONTROLLER_BUSY = 9;
  ERROR_CODE_INVALID_SEQUENCE = 10;
  ERROR_CODE_DUPLICATE_EVENT = 11;
  ERROR_CODE_UNSUPPORTED_KEY = 12;
  ERROR_CODE_INVALID_TEXT = 13;
  ERROR_CODE_NO_FOREGROUND_TARGET = 14;
  ERROR_CODE_INPUT_BLOCKED = 15;
  ERROR_CODE_INPUT_PARTIAL = 16;
  ERROR_CODE_INTERNAL = 17;
}

